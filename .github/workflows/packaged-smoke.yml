name: Packaged smoke

# Deliberately outside the main CI matrix, the same way the browser and Python
# jobs are. Each job builds a ~130 MB executable and drives it end to end; the
# main workflow already runs 13-16 minutes on Windows, and paying this on every
# push would buy nothing that a release gate does not buy better.
#
# Dispatch-only for now. The step bodies drive a packaged executable whose
# runtime archive does not exist in this repository yet, so a scheduled run
# would be a red badge that says nothing new every day.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged-smoke:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Long enough for a cold start on Windows under antivirus (§9.1 allows
    # 180 s for that alone) plus a real render, and short enough that a hung
    # job is cut rather than left holding a runner.
    timeout-minutes: 45

    strategy:
      # Every platform reports. One failing does not hide what the others found,
      # and the whole point of this job is knowing which platforms were proven.
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS arm64
            tag: darwin-arm64
          - os: windows-latest
            name: Windows x64
            tag: win32-x64
          - os: ubuntu-latest
            name: Linux x64
            tag: linux-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # The same pin the main workflow uses; a smoke on a different Node
          # would be proving a build nobody ships.
          node-version: 24.9.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Keyed by the runtime version rather than a lockfile hash: what is being
      # cached is the downloaded browser and model set, and those change when
      # the pinned runtime changes, not when a dependency does. A cache that
      # expires must not silently turn into a passing run — the smoke restores
      # it into an explicit location and fails if a required component is not
      # there afterwards.
      - name: Restore downloaded runtime caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vidcom-smoke
            ~/AppData/Local/vidcom-smoke
          key: vidcom-smoke-${{ matrix.tag }}-${{ hashFiles('scripts/build-runtime-archives.mjs') }}

      - name: Build the artifact for this runner
        # No cross-building (DR-1): the artifact embeds this machine's Node
        # binary and native runtime, so a "Linux build" made anywhere else is a
        # file that runs nowhere.
        run: bun run build:artifact

      - name: Run the packaged smoke
        env:
          # A skipped required step is a failure here. R8.4: a missing required
          # component fails the job rather than being reported as "not reached".
          VIDCOM_DOCTOR_STRICT: "1"
        run: node scripts/packaged-smoke/run.mjs > packaged-smoke-${{ matrix.tag }}.json

      - name: Upload the evidence
        # Uploaded even when the smoke fails: a failing run is exactly when
        # somebody needs the step timings and the reason each step gave.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-smoke-${{ matrix.tag }}
          path: packaged-smoke-${{ matrix.tag }}.json
          if-no-files-found: warn
