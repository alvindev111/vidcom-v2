name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-checks:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.9.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Verify import boundaries reject an invalid dependency
        run: bun run test:boundaries

      - name: Test
        run: bun run test

      - name: Verify MCP contracts, audit forwarding, and stdio cleanliness
        run: bun run test:mcp-contract

      - name: Verify committed golden contracts
        run: bun run test:golden

      - name: Verify database schema drift
        run: bun run test:schema-drift

      - name: Production build
        run: bun run build

      - name: Real Next runtime and SSE smoke
        run: bun run test:runtime-smoke
