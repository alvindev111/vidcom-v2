name: CI

# Platform coverage differs by event, deliberately — see the matrix comment below.
# Pull requests run Linux and Windows; pushes to main and manual dispatches run
# macOS as well.
on:
  pull_request:
  push:
    branches:
      - main
    # Documentation-only pushes do not need three platforms of typecheck, lint,
    # build and test. A spec round can be a dozen commits of markdown, and each
    # one used to cost a full macOS-inclusive run — more quota than the entire
    # change was worth. The one gate that does read these files,
    # `test:spec-paths`, is a second of local work: run it before pushing docs.
    # Anything under `packages/`, `src/`, `scripts/` or the workflows themselves
    # still triggers the full matrix, so no code path loses coverage.
    # `**.md`, not `**/*.md`: in GitHub's matcher `**` spans `/`, so `**/*.md`
    # requires a directory segment and would skip root files — AGENTS.md and
    # CLAUDE.md among them, which is exactly the kind of edit this is for.
    paths-ignore:
      - "llm-documents/**"
      - "**.md"
  # Lets the full matrix be run against any branch on demand, which is how a
  # platform-specific change gets verified before it reaches main.
  workflow_dispatch:

permissions:
  contents: read

# Supersede rather than pile up. A private repo bills macOS at ten times the wall
# clock, so one full run costs about 63 minutes of quota for four minutes of real
# work — and pushing a fix while the previous run is still going used to pay for
# both. Grouping by workflow and ref means the newest push on a branch is the only
# one still spending.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    strategy:
      # Report every platform on a failure: a defect is usually specific to one
      # of them, and cancelling the others hides whether it is.
      fail-fast: false
      # macOS is left off pull requests. On a private repo it bills at ten times
      # the wall clock, which made it 40 of the 63 minutes a full run costs for
      # 3 of its 15 real minutes — more than half the quota for the platform least
      # likely to be the one that breaks. It still runs on every push to main and
      # on demand, so nothing reaches the default branch unverified there, and a
      # macOS-specific suspicion on a branch is one workflow_dispatch away.
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"os":"ubuntu-latest","name":"Linux x64"},{"os":"windows-latest","name":"Windows x64"}]}' || '{"include":[{"os":"ubuntu-latest","name":"Linux x64"},{"os":"macos-latest","name":"macOS arm64"},{"os":"windows-latest","name":"Windows x64"}]}') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.9.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # The VieNeu sidecar is Python. The speech engine itself is a large
      # download and is NOT installed here; the interpreter is enough to compile
      # the worker and prove it degrades correctly without the engine.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Narration audio from every engine is normalised through FFmpeg, so
      # without it the audio pipeline suite can only skip — which is how it went
      # unverified for several rounds. Installed from each platform's own package
      # manager rather than a third-party action.
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress --yes

      - name: Report media toolchain
        run: ffmpeg -version && ffprobe -version && python --version

      # Bun resolves the lockfile, but every script runs under Node. Node is the
      # runtime the product ships on (the Phase 0 gate chose Node SEA), and Bun
      # on Windows cannot resolve `node:sqlite`, which the datastore needs.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Report toolchain
        run: node --version && npm --version && bun --version

      - name: Typecheck
        run: npm run typecheck

      - name: Verify embedded agent-kit bundle is current
        run: npm run test:agent-kit

      - name: Lint
        run: npm run lint

      - name: Verify import boundaries reject an invalid dependency
        run: npm run test:boundaries

      # The flag turns a missing FFmpeg into a failure instead of a skip, so this
      # job cannot report green while the narration audio pipeline goes unrun.
      - name: Test
        run: npm run test
        env:
          VIDCOM_REQUIRE_FFMPEG: "1"

      - name: Verify the VieNeu sidecar contract without its speech engine
        run: npm run test:vieneu-sidecar

      - name: Verify MCP contracts, audit forwarding, and stdio cleanliness
        run: npm run test:mcp-contract

      - name: Verify committed golden contracts
        run: npm run test:golden

      - name: Verify database schema drift
        run: npm run test:schema-drift

      - name: Verify Verification Matrix test paths
        run: npm run test:spec-paths

      - name: Production build
        run: npm run build

      - name: Real Next runtime and SSE smoke
        run: npm run test:runtime-smoke
