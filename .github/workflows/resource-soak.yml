name: Resource soak

on:
  workflow_call:
    inputs:
      profile:
        description: Bounded presubmit or full release soak
        required: false
        type: string
        default: presubmit
  workflow_dispatch:
    inputs:
      profile:
        description: Soak profile
        required: true
        type: choice
        default: release
        options:
          - presubmit
          - release
  pull_request:

permissions:
  contents: read

concurrency:
  group: resource-soak-${{ github.ref }}-${{ inputs.profile || 'presubmit' }}
  cancel-in-progress: true

jobs:
  resource-soak:
    name: Resource soak (${{ github.event_name == 'pull_request' && 'presubmit' || inputs.profile || 'release' }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      VIDCOM_SOAK_PROFILE: ${{ github.event_name == 'pull_request' && 'presubmit' || inputs.profile || 'release' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.9.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Verify exact source revision
        env:
          VIDCOM_EXPECTED_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node -e "const { execFileSync } = require('node:child_process'); const actual = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(); if (actual !== process.env.VIDCOM_EXPECTED_GIT_SHA) { console.error('expected ' + process.env.VIDCOM_EXPECTED_GIT_SHA + ', got ' + actual); process.exit(1); }"
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Run bounded resource soak
        env:
          VIDCOM_EXPECTED_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node scripts/run-resource-soak.mjs
          --profile "$VIDCOM_SOAK_PROFILE"
          --output .artifacts/resource-soak
      - name: Upload RSS and heap evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resource-soak-${{ env.VIDCOM_SOAK_PROFILE }}
          path: .artifacts/resource-soak/resource-soak-${{ env.VIDCOM_SOAK_PROFILE }}.json
          if-no-files-found: error
          retention-days: 30
