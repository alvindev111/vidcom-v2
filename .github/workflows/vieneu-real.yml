name: VieNeu real engine

# Opt-in, and deliberately not part of CI. It installs the speech engine and
# downloads model weights, which is minutes and hundreds of megabytes that no pull
# request should wait on. Everything else about the provider is covered by the
# fake-process suite in CI — but a fake process cannot catch a wrong SDK call, and
# a wrong SDK call is the defect that shipped the first time this provider was
# written. This is the run that catches that class of defect.
#
# NOT DISPATCHABLE UNTIL THIS FILE IS ON THE DEFAULT BRANCH. GitHub resolves a
# workflow_dispatch by looking the workflow up on the default branch, so the API
# answers 404 for a workflow that only exists on a feature branch — even when the
# dispatch names that branch as its ref. Once merged, dispatch against any ref.
#
# After merging, add a nightly:
#
#   schedule:
#     - cron: "0 18 * * *"   # runs on the default branch only
#
# Enabling it before the sidecar exists on the default branch would mean a red
# build every night for a file that is not there yet.
on:
  workflow_dispatch:
    inputs:
      model_revision:
        description: >-
          Hugging Face revision to pin the weights to. Leave empty to take the
          repository head, which the sidecar then reports back so the run stays
          traceable.
        required: false
        type: string

permissions:
  contents: read

# A double dispatch supersedes rather than paying for two model downloads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-engine:
    name: Linux x64 CPU
    runs-on: ubuntu-latest
    # A cold run is dominated by the model download, and a download that stalls
    # must not sit here burning quota — the fetch is bounded on its own step below,
    # so this ceiling only has to cover the work either side of it.
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.9.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      # The CPU install is torch-free — upstream v3 Turbo runs on ONNX Runtime —
      # so this stays a normal pip install rather than a CUDA image.
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/adapter/sidecars/vieneu/requirements.txt

      # Narration from every engine is normalised through FFmpeg, and this run
      # goes through the registry, so the toolchain is required here too.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # $HOME rather than a workspace path: the cache has to survive a fresh
      # checkout, and the sidecar rejects a relative HF_HOME.
      - name: Resolve the model cache location
        run: echo "VIENEU_MODEL_CACHE=$HOME/.cache/vidcom-vieneu" >> "$GITHUB_ENV"

      # Keyed on the engine pin and the requested revision. Unpinned runs share one
      # `head` key, so a cold download happens on the first run and whenever
      # upstream weights change enough to miss — the restore-key keeps that from
      # being every run.
      - name: Restore the model cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.VIENEU_MODEL_CACHE }}
          key: vieneu-model-${{ hashFiles('packages/adapter/sidecars/vieneu/requirements.txt') }}-${{ inputs.model_revision || 'head' }}
          restore-keys: |
            vieneu-model-${{ hashFiles('packages/adapter/sidecars/vieneu/requirements.txt') }}-

      # hf_transfer is CI-only and not in requirements.txt: it fetches shards in
      # parallel, which is the difference between a tolerable cold run and sitting
      # on a single-stream download.
      - name: Install the speech engine
        run: |
          python -m pip install --disable-pip-version-check -r packages/adapter/sidecars/vieneu/requirements.txt
          python -m pip install --disable-pip-version-check hf_transfer

      # Bounded on its own step so a stalled or blocked fetch fails in fifteen
      # minutes instead of holding the job to its ceiling. Also the only place the
      # weights are measured and the resolved commit recorded, which is what makes
      # a given WAV traceable to what produced it.
      - name: Warm the model cache
        timeout-minutes: 15
        env:
          HF_HOME: ${{ env.VIENEU_MODEL_CACHE }}
          HF_HUB_ENABLE_HF_TRANSFER: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          MODEL_REVISION: ${{ inputs.model_revision }}
        run: |
          python - <<'PY'
          import os, pathlib
          from huggingface_hub import snapshot_download
          revision = os.environ.get("MODEL_REVISION") or None
          path = snapshot_download(repo_id="pnnbao-ump/VieNeu-TTS-v3-Turbo", revision=revision)
          root = pathlib.Path(path)
          total = sum(f.stat().st_size for f in root.rglob("*") if f.is_file())
          print(f"resolved revision: {root.name}")
          print(f"weights on disk:   {total / 1024 / 1024:.1f} MiB")
          PY
          du -sh "$HF_HOME" || true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Report toolchain
        run: |
          node --version
          python --version
          ffmpeg -version | head -1
          # getattr, not attribute access: a missing __version__ is not a reason to
          # fail the run before the engine has been asked to do anything.
          python -c "import vieneu; print('vieneu', getattr(vieneu, '__version__', 'unknown'))"

      # Standalone so the engine's own voice list lands in the log even if the
      # suite below fails: it is the answer to whether the ids VidCom recommends
      # are ids this engine actually offers.
      - name: Probe the engine for its real voice list
        env:
          HF_HOME: ${{ env.VIENEU_MODEL_CACHE }}
          VIDCOM_VIENEU_REVISION: ${{ inputs.model_revision }}
        run: python packages/adapter/sidecars/vieneu/worker.py --probe

      # The weights are already local by now, so this is bounded to the synthesis
      # itself rather than to a possible download.
      - name: Synthesize Vietnamese narration with the real engine
        timeout-minutes: 12
        env:
          VIDCOM_VIENEU_REAL: "1"
          VIDCOM_VIENEU_COMMAND: '["python", "${{ github.workspace }}/packages/adapter/sidecars/vieneu/worker.py"]'
          VIDCOM_VIENEU_MODEL_CACHE: ${{ env.VIENEU_MODEL_CACHE }}
          VIDCOM_VIENEU_REVISION: ${{ inputs.model_revision }}
          VIDCOM_VIENEU_OUTPUT_DIR: ${{ runner.temp }}/vieneu-narration
        run: bun run test:vieneu-real

      # Keeps the audio for a human to listen to: a WAV that decodes and measures
      # correctly can still sound wrong, and nothing in an assertion catches that.
      - name: Upload the synthesized narration
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vieneu-narration
          path: ${{ runner.temp }}/vieneu-narration/*.wav
          if-no-files-found: warn
          retention-days: 7
