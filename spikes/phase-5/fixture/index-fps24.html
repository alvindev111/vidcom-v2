<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>spike root composition</title>
    <script src="/vendor/hyperframe.runtime.iife.js"></script>
    <style>
      body { margin: 0; background: #101014; color: #fff; font: 16px/1.4 system-ui; }
      .comp-layer { position: absolute; inset: 0; padding: 40px; }
      .caption .w { opacity: 0.45; }
      .caption .w.active { opacity: 1; color: #7dd3fc; }
    </style>
  </head>
  <body
    data-composition-id="root"
    data-width="1280"
    data-height="720"
    data-duration="12"
    data-fps="24"
  >
    <div
      id="scene-1-layer"
      class="comp-layer clip"
      data-composition-id="scene-1"
      data-composition-src="compositions/scene-1.html"
      data-start="0"
      data-duration="6"
      data-track-index="0"
    >
    </div>

    <div
      id="scene-2-layer"
      class="comp-layer clip"
      data-composition-id="scene-2"
      data-composition-src="compositions/scene-2.html"
      data-start="6"
      data-duration="6"
      data-track-index="0"
    >
    </div>

    <!-- Caption highlight driven by the runtime's own clock, per Design §5.14. -->
    <script id="vidcom-caption-runtime">
      (() => {
        const state = { fps: 30, frame: 0 };
        const roots = () => {
          const list = [document];
          for (const frame of document.querySelectorAll("iframe")) {
            try { if (frame.contentDocument) list.push(frame.contentDocument); } catch {}
          }
          return list;
        };
        const words = () => roots().flatMap((r) => [...r.querySelectorAll(".caption .w")]);
        const paint = () => {
          const t = state.frame / (state.fps || 30);
          for (const span of words()) {
            const start = Number(span.dataset.start);
            const end = Number(span.dataset.end);
            span.classList.toggle("active", t >= start && t < end);
          }
          window.__vidcomCaption = { t, active: [...words()].filter((w) => w.classList.contains("active")).map((w) => w.textContent) };
        };
        // The runtime posts `{source:"hf-preview", type:"state"|"timeline"}` to the parent.
        // We are inside the same document, so we observe the same calls by wrapping the
        // one function the runtime uses to reach the parent.
        const originalPost = window.parent.postMessage.bind(window.parent);
        window.parent.postMessage = (message, ...rest) => {
          try {
            if (message && message.source === "hf-preview") {
              if (message.type === "timeline" && Number(message.fps) > 0) state.fps = Number(message.fps);
              if (message.type === "state" && Number.isFinite(message.frame)) {
                state.frame = Number(message.frame);
                paint();
              }
            }
          } catch {}
          return originalPost(message, ...rest);
        };
        paint();
      })();
    </script>
  </body>
</html>
